# ============================================================
# NetworkPolicies — zero-trust pod-to-pod communication
# ============================================================
---
# Default deny all ingress in namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: wordfix
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Nginx: allow external traffic (NodePort) + from any pod for health
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
---
# Showcase: allow external traffic (NodePort)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-showcase-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: showcase
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
---
# Gateway: allow from nginx only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-nginx
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - port: 8080
          protocol: TCP
---
# Web (Django): allow from gateway + nginx + celery-beat + celery-worker
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-beat
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-worker
      ports:
        - port: 8000
          protocol: TCP
---
# Auth service: allow from gateway + web (auto-provision)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-service-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - port: 8001
          protocol: TCP
        - port: 50051
          protocol: TCP
---
# PostgreSQL (main DB): allow from web + celery-worker + celery-beat
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-beat
      ports:
        - port: 5432
          protocol: TCP
---
# Auth DB: allow from auth-service only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-db-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
      ports:
        - port: 5432
          protocol: TCP
---
# Redis: allow from web + celery-worker + celery-beat + auth-service + gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-beat
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: 6379
          protocol: TCP
---
# RabbitMQ: allow from web + celery-worker + celery-beat + auth-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-ingress
  namespace: wordfix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celery-beat
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
      ports:
        - port: 5672
          protocol: TCP
        - port: 15672
          protocol: TCP
