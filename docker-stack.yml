version: "3.8"

# ================================================================
# WordFix — Docker Swarm Production Stack
# Sprint 13.5: Microservices Migration (Phase 1)
# ================================================================
# Services:
#   - db (Postgres 16) — monolith database
#   - auth-db (Postgres 16) — auth service database
#   - redis (Redis 7) — cache + celery broker + token blacklist
#   - rabbitmq (RabbitMQ 3.13) — event bus
#   - gateway (FastAPI) — API Gateway
#   - auth-service (FastAPI) — Auth microservice
#   - web (Django/Gunicorn) — monolith
#   - celery_worker — monolith async tasks
#   - celery_beat — monolith periodic tasks
#   - nginx — frontend + reverse proxy
# ================================================================

services:
  # ── Infrastructure ─────────────────────────────────────

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_monolith:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wordfix}
      POSTGRES_USER: ${POSTGRES_USER:-wordfix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wordfix_pass}
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 512M

  auth-db:
    image: postgres:16-alpine
    volumes:
      - postgres_auth:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: wordfix_auth
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wordfix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-wordfix_mq}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # ── API Gateway ────────────────────────────────────────

  gateway:
    image: wordfix/api-gateway:latest
    environment:
      - AUTH_SERVICE_GRPC=auth-service:50051
      - MONOLITH_URL=http://web:8000
      - JWT_SECRET=${SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-wordfix}:${RABBITMQ_PASS:-wordfix_mq}@rabbitmq:5672/
      - HTTP_PORT=8080
      - DEBUG=False
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # ── Auth Service ───────────────────────────────────────

  auth-service:
    image: wordfix/auth-service:latest
    environment:
      - DATABASE_URL=postgresql+asyncpg://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_pass}@auth-db:5432/wordfix_auth
      - JWT_SECRET=${SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_LIFETIME_MINUTES=60
      - JWT_REFRESH_LIFETIME_DAYS=7
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-wordfix}:${RABBITMQ_PASS:-wordfix_mq}@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/3
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GRPC_PORT=50051
      - HTTP_PORT=8001
      - DEBUG=False
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # ── Django Monolith ────────────────────────────────────

  web:
    image: wordfix/monolith:latest
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backend_logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - POSTGRES_DB=${POSTGRES_DB:-wordfix}
      - POSTGRES_USER=${POSTGRES_USER:-wordfix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wordfix_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-wordfix}:${RABBITMQ_PASS:-wordfix_mq}@rabbitmq:5672/
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --threads 2
      --timeout 120
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  celery_worker:
    image: wordfix/monolith:latest
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - media_data:/app/media
      - backend_logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-wordfix}
      - POSTGRES_USER=${POSTGRES_USER:-wordfix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wordfix_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-wordfix}:${RABBITMQ_PASS:-wordfix_mq}@rabbitmq:5672/
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  celery_beat:
    image: wordfix/monolith:latest
    command: >
      bash -c "sleep 15 && celery -A config beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - backend_logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-wordfix}
      - POSTGRES_USER=${POSTGRES_USER:-wordfix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wordfix_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # ── Nginx (Frontend + Reverse Proxy) ───────────────────

  nginx:
    image: wordfix/frontend:latest
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - media_data:/app/media:ro
    networks:
      - wordfix-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M

# ── Volumes ──────────────────────────────────────────────

volumes:
  postgres_monolith:
  postgres_auth:
  redis_data:
  rabbitmq_data:
  media_data:
  static_data:
  backend_logs:

# ── Configs ──────────────────────────────────────────────

configs:
  nginx_conf:
    file: ./nginx/nginx.conf

# ── Networks ─────────────────────────────────────────────

networks:
  wordfix-internal:
    driver: overlay
