---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: wordfix
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: wordfix
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: wordfix
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: wordfix
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: wordfix
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      initContainers:
        # 1. Wait for database to be ready
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo 'waiting for db...'; sleep 2; done"]
        # 2. Run Django migrations
        - name: migrate
          image: wordfix/monolith:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: app-secrets
        # 3. Collect static files
        - name: collectstatic
          image: wordfix/monolith:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: app-secrets
      containers:
        - name: web
          image: wordfix/monolith:latest
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - config.wsgi:application
            - --bind=0.0.0.0:8000
            - --workers=3
            - --threads=2
            - --timeout=120
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: app-secrets
            - secretRef:
                name: rabbitmq-secrets
            - secretRef:
                name: ai-secrets
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_CLIENT_SECRET
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 1000m
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: logs
              mountPath: /app/logs
          startupProbe:
            httpGet:
              path: /admin/login/
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: backend-logs-pvc
