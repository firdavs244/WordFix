# ============================================================
# PodDisruptionBudgets — availability guarantees
# ============================================================
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: wordfix
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: wordfix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
