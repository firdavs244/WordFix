---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: wordfix
  labels:
    app.kubernetes.io/name: auth-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wordfix
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: auth-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: wordfix
  labels:
    app.kubernetes.io/name: auth-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wordfix
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: wordfix
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: auth-db-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "auth_user", "-d", "wordfix_auth"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "auth_user", "-d", "wordfix_auth"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "auth_user", "-d", "wordfix_auth"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
