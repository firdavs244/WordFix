---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: wordfix
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: wordfix
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: wordfix
    spec:
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: wait-for-web
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q --spider http://web:8000/admin/login/; do echo 'waiting for web...'; sleep 3; done"]
      containers:
        - name: celery-worker
          image: wordfix/monolith:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: app-secrets
            - secretRef:
                name: rabbitmq-secrets
            - secretRef:
                name: ai-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 1000m
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            exec:
              command: ["celery", "-A", "config", "inspect", "ping", "--timeout", "10"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: backend-logs-pvc
