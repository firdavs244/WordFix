---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: wordfix
  labels:
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: wordfix
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Recreate ensures only one beat instance runs at a time (singleton)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: wordfix
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-web
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q --spider http://web:8000/admin/login/; do echo 'waiting for web...'; sleep 3; done"]
        # Delay to let worker register before beat starts scheduling
        - name: delay
          image: busybox:1.36
          command: ["sh", "-c", "sleep 15"]
      containers:
        - name: celery-beat
          image: wordfix/monolith:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - config
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: backend-logs-pvc
